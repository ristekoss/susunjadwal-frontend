name: Deploy to Vercel

on:
  push:
    branches-ignore:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.WEBDEV_VERCEL_TOKEN }}
        run: npx vercel deploy --yes --token "$VERCEL_TOKEN" --build-env CI=false
